[project]
name = "jaxfads"
version = "0.1.0"
description = "eXponential FAmily Dynamical System"
authors = [{ name = "yuanz", email = "yuanz271@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "optax>=0.1.7",
    "numpy>=1.24.4",
    "equinox>=0.11.12",
    "omegaconf>=2.3.0",
    "rich>=14.0.0",
    "tensorflow-probability[jax]>=0.24.0,<0.26.0",
    "jax>=0.4.38,<0.7.0",
    "gearax @ git+https://github.com/yuanz271/gearax.git@49d4480ec8739914b8983c22f8b3824e893723fd",
]

[dependency-groups]
dev = [
    "chex>=0.1.90",
    "matplotlib>=3.10.1",
    "pytest>=8.3.4",
    "ruff>=0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/yuanz271/jaxfads"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxfads"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
lint.ignore = ["E501", "F722"]

