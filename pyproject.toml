[project]
name = "jaxfads"
dynamic = ["version"]
description = "eXponential FAmily Dynamical System"
authors = [{ name = "yuanz", email = "yuanz271@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "optax>=0.1.7",
    "numpy>=1.24.4",
    "equinox>=0.11.12",
    "omegaconf>=2.3.0",
    "rich>=14.0.0",
    "tfp-nightly[jax]",  # stable tensorflow-probability is JAX<0.7 only; nightly fixes JAX 0.7+ compat (see tensorflow/probability#1994)
    "jax>=0.4.38",
    "gearax @ git+https://github.com/yuanz271/gearax.git@9ef627f3f13940ec86e78228bd338329f172c959",  # bumped past gearax's own jax<0.7.0 pin removal; no override-dependencies needed here anymore
    "jaxtyping>=0.3.2",
]

# GPU support is opt-in, not assumed: the base `jax` dependency above installs
# CPU-only by default. Users pick exactly one of these extras based on their
# system's CUDA version (jax[cuda12] and jax[cuda13] cannot coexist in the same
# environment -- each installs a jaxlib build compiled against a specific CUDA
# toolkit, so `pip install jaxfads[cuda12,cuda13]` together would conflict, not
# combine). Note CUDA 13 dropped support for some older GPU architectures
# (Maxwell/Volta/Pascal, SM < 7.5) that CUDA 12 still supports, so cuda13 is
# not a strict superset -- users on older GPUs should stay on cuda12.
[project.optional-dependencies]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]

[dependency-groups]
dev = [
    "chex>=0.1.90",
    "matplotlib>=3.10.1",
    "numpydoc>=1.7.0",
    "prek>=0.3.3",
    "pytest>=8.3.4",
    "ruff>=0.9.4",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/yuanz271/jaxfads"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxfads"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
preview = true

[tool.ruff.lint]
ignore = ["E501", "F722"]
extend-select = ["FURB"]

[tool.numpydoc_validation]
checks = ["GL01", "SS02", "PR01", "PR10", "RT01"]
override_GL01 = "See base class"
override_PR01 = "See base class"
override_RT01 = "See base class"

