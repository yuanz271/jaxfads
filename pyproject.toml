[project]
name = "jaxfads"
dynamic = ["version"]
description = "eXponential FAmily Dynamical System"
authors = [{ name = "yuanz", email = "yuanz271@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "optax>=0.1.7",
    "numpy>=1.24.4",
    "equinox>=0.11.12",
    "omegaconf>=2.3.0",
    "rich>=14.0.0",
    "tfp-nightly[jax]",  # stable tensorflow-probability is JAX<0.7 only; nightly fixes JAX 0.7+ compat (see tensorflow/probability#1994)
    "jax>=0.4.38",
    "gearax @ git+https://github.com/yuanz271/gearax.git@29d694e66adb11c5bf6dd43c52ff5f839cd86f10",
    "jaxtyping>=0.3.2",
]

[dependency-groups]
dev = [
    "chex>=0.1.90",
    "matplotlib>=3.10.1",
    "numpydoc>=1.7.0",
    "prek>=0.3.3",
    "pytest>=8.3.4",
    "ruff>=0.9.4",
    "ty>=0.0.1",
]

[tool.uv]
# gearax (pinned commit) declares jax<0.7.0 with no documented reason (its own
# jax usage -- jax.tree.map, Array, lax, jnp, random -- uses nothing removed in
# jax 0.7+ itself). Override to the true latest (0.11.0):
#   - jax 0.7.0/0.7.1: excluded by equinox's own constraint (jax!=0.7.0,!=0.7.1)
#   - jax 0.9.0+ initially appeared to break jax.make_mesh's default mesh axes
#     (Explicit since ~0.9.0, the new "sharding-in-types" mode), under which
#     lax.with_sharding_constraint (used by eqx.filter_shard in this module's
#     own trainer.py, vendored from gearax) raises "only refer to Auto axes
#     of the mesh ... meant to use the reshard API?". Fixed directly in
#     src/jaxfads/trainer.py by requesting axis_types=(Auto,) explicitly on
#     the mesh jaxfads itself constructs -- not a gearax/equinox bug, jaxfads
#     just needed to ask for the pre-0.9 mesh behavior explicitly.
#   - jax 0.11.0 (latest): with that fix, full test suite passes (single- and
#     multi-GPU), and this project's own real training script
#     (jaxfads_dev_train.py in the calling project) runs correctly including
#     the largest observation_dim=497, batch_size=16 case (the case the
#     Woodbury eloglik patch fixed) -- confirms all three fixes compose.
#   - jax 0.11.0 dropped Python 3.11 support, hence requires-python bumped to
#     >=3.12 below (this project's actual venv runs Python 3.13 regardless).
# GPU acceleration (e.g. jax[cuda12]) is left to the consumer's own
# environment/config -- not hardcoded here.
override-dependencies = ["jax==0.11.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/yuanz271/jaxfads"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxfads"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
preview = true

[tool.ruff.lint]
ignore = ["E501", "F722"]
extend-select = ["FURB"]

[tool.numpydoc_validation]
checks = ["GL01", "SS02", "PR01", "PR10", "RT01"]
override_GL01 = "See base class"
override_PR01 = "See base class"
override_RT01 = "See base class"

